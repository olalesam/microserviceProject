server:
  port: 8761

spring:
  application:
    name: eurekaserver
  cloud:
    config:
      enabled: false
      discovery:
        enabled: false
  config:
    import: ""

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false

  server:
    enable-self-preservation: true
#    renewal-percent-threshold: 0.85
#    viction-interval-timer-in-ms: 60000
