build:
  version: "1.0.0-SNAPSHOT"

server:
  port: 8080

spring:
  application:
    name: department
  profiles:
    active: prod

  datasource:
    url: jdbc:mysql://localhost:3306/test?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
    username: root
    password: root
    # driver-class-name: com.mysql.cj.jdbc.Driver  # optionnel, auto-détecté

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    # ❌ supprime l’ancienne ligne H2
    # database-platform: org.hibernate.dialect.H2Dialect
    # ✅ soit tu ne mets rien (auto-détection), soit :
    database-platform: org.hibernate.dialect.MySQLDialect
    # ou MySQL8 si tu préfères :
    # database-platform: org.hibernate.dialect.MySQL8Dialect

  cloud:
    config:
      enabled: false
    discovery:
      enabled: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    shutdown:
      enabled: true
