server:
  port: 8081
  # ssl:
  #   enabled: false

spring:
  application:
    name: TEACHER-MICROSERVICE      # ← nom affiché dans Eureka
  datasource:
    url: jdbc:h2:file:~/teacherdb;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.H2Dialect
  cloud:
    config:
      enabled: false
    discovery:
      enabled: true

eureka:                              # ← à la RACINE (pas sous spring)
  instance:
    prefer-ip-address: true
    secure-port-enabled: false       # ← force HTTP, évite le HTTPS “fantôme”
    non-secure-port: 8081
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: "http://localhost:8761/eureka/"

management:
  endpoints:
    web:
      exposure:
        include: '*'
